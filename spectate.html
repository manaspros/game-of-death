<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gameofdeath — spectator</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'PressStart'; src: url(/assets/fonts/PressStart2P.woff2) format('woff2'); font-display: swap; }
    @font-face { font-family: 'PixelBody'; src: url(/assets/fonts/VT323.woff2) format('woff2'); font-display: swap; }
    :root {
      --bg-base: #08080d; --bg-surface: #0f0f16; --bg-elevated: #16161f;
      --border: #1e1e2a; --border-strong: #2a2a3a;
      --text-primary: #e8e8ed; --text-secondary: #8888a0; --text-tertiary: #555566;
      --p1: #4a9eff; --p2: #ff6b8a; --ok: #5fd38d; --bad: #ff6b6b; --warn: #f0b955;
      --font-sans: 'PixelBody', system-ui, sans-serif; --font-pixel: 'PressStart', monospace; --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg-base); color: var(--text-primary); font-family: var(--font-sans); height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; padding: 12px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border); }
    header h1 { font: 12px var(--font-pixel); }
    .meta { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); }
    .status { margin-left: auto; font-family: var(--font-mono); font-size: 12px; }
    .status.live { color: var(--ok); } .status.down { color: var(--bad); }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; padding: 12px; }
    .board-wrap { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    #board-box { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    canvas { image-rendering: pixelated; }
    #board-box { position: relative; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(8,8,13,0.86); text-align: center; padding: 24px; }
    .overlay[hidden] { display: none; }
    .ov-title { font: 24px/1.35 var(--font-pixel); }
    .ov-sub { font-size: 30px; color: var(--text-secondary); }
    .ov-line { font-size: 26px; color: var(--text-secondary); max-width: 560px; line-height: 1.3; }
    .overlay.p1 .ov-title { color: var(--p1); } .overlay.p2 .ov-title { color: var(--p2); }
    .progress { height: 6px; background: var(--bg-elevated); border-radius: 3px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: var(--text-secondary); transition: width 0.08s linear; }
    aside { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .card h2 { font: 10px var(--font-pixel); margin-bottom: 6px; }
    .card.p1 h2 { color: var(--p1); } .card.p2 h2 { color: var(--p2); }
    .who { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; word-break: break-all; }
    .bar { height: 8px; background: var(--bg-elevated); border-radius: 4px; overflow: hidden; margin: 4px 0 6px; }
    .bar > div { height: 100%; width: 100%; transition: width 0.15s; }
    .p1 .bar > div { background: var(--p1); } .p2 .bar > div { background: var(--p2); }
    .stat { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; }
    #log { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
    #log div { padding: 1px 0; color: var(--text-secondary); white-space: pre-wrap; }
    #log details.analysis { padding: 2px 0 4px 14px; color: var(--text-secondary); }
    #log details.analysis summary { cursor: pointer; color: var(--text-tertiary); font-size: 14px; }
    #log details.analysis div { white-space: pre-wrap; font-size: 13px; line-height: 1.5; margin-top: 4px; border-left: 2px solid var(--border-strong); padding-left: 10px; }
    #log .why { color: var(--text-secondary); font-style: italic; padding-left: 14px; }
    #log .ok { color: var(--text-primary); } #log .rej { color: var(--bad); }
    #log .sys { color: var(--warn); } #log .round { color: var(--ok); border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; overflow-y: auto; } #log { min-height: 240px; } }
  </style>
</head>
<body>
  <header>
    <h1>gameofdeath — spectator</h1>
    <span class="meta" id="round">Round –</span>
    <span class="meta" id="phase">waiting…</span>
    <span class="meta" id="preset"></span>
    <span class="status down" id="status">connecting…</span>
  </header>
  <main>
    <section class="board-wrap">
      <div id="board-box"><canvas id="board" width="10" height="10"></canvas><div id="overlay" class="overlay" hidden></div></div>
      <div class="progress"><div id="progress"></div></div>
    </section>
    <aside>
      <div class="cards">
        <div class="card p1"><h2>Player 1</h2><div class="who" id="p1-who">–</div>
          <div class="stat"><span>Heart</span><span id="p1-hp">100</span></div><div class="bar"><div id="p1-bar"></div></div>
          <div class="stat"><span>Moves left</span><span id="p1-moves">–</span></div></div>
        <div class="card p2"><h2>Player 2</h2><div class="who" id="p2-who">baseline bot</div>
          <div class="stat"><span>Heart</span><span id="p2-hp">100</span></div><div class="bar"><div id="p2-bar"></div></div>
          <div class="stat"><span>Moves left</span><span id="p2-moves">–</span></div></div>
      </div>
      <div id="log"></div>
    </aside>
  </main>
  <script type="module" src="/src/spectate/main.ts"></script>
</body>
</html>
